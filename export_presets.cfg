html/head_include="<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no\"><style>html,body{touch-action:none;overscroll-behavior:none}#fullscreen-toggle{position:fixed;top:max(8px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right));z-index:100;width:44px;height:44px;padding:10px;border:1px solid #6f92ac;border-radius:8px;background:#08131ee6;color:#fff;font:14px sans-serif;touch-action:manipulation}#fullscreen-status{position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:100;color:white;background:#08131e;padding:8px;font:14px sans-serif}#fullscreen-status:empty{display:none}</style><script>document.addEventListener('DOMContentLoaded',()=>{const button=document.createElement('button');button.id='fullscreen-toggle';button.type='button';button.innerHTML='<svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" aria-hidden=\"true\"><path d=\"M9 3H3v6m12-6h6v6M3 15v6h6m12-6v6h-6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/></svg>';button.setAttribute('aria-label','Pantalla completa');const status=document.createElement('div');status.id='fullscreen-status';status.setAttribute('role','status');document.body.append(button,status);if(!document.fullscreenEnabled){button.disabled=true;button.title='Pantalla completa no disponible';return;}const update=()=>{const label=document.fullscreenElement?'Salir de pantalla completa':'Pantalla completa';button.title=label;button.setAttribute('aria-label',label);button.style.background=document.fullscreenElement?'#164c66e6':'#08131ee6';button.setAttribute('aria-pressed',String(!!document.fullscreenElement));};update();document.addEventListener('fullscreenchange',update);for(const event of ['pointerdown','pointerup','touchstart','touchend'])button.addEventListener(event,e=>e.stopPropagation());button.addEventListener('click',async e=>{e.stopPropagation();status.textContent='';try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch(error){status.textContent='No se pudo activar la pantalla completa. Intentá nuevamente.';}document.getElementById('canvas')?.focus();});});</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
